language: 'en-US'
early_access: false
ignore_from_diff:
  - '**/package.json'
  - 'bun.lock'
  - '.coderabbit.yaml'
  - 'EFFECT-MIGRATION.md'
  - '**/_generated/**'
reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  review_details: false
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
