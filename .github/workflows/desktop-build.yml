name: Desktop build

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      nightly:
        type: boolean
        default: false
      build_updater:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0 # Fetch full history for consistency
          persist-credentials: false

      - name: Check for release build changes
        id: check_changes
        env:
          GITHUB_EVENT_NAME: ${{ inputs.nightly && 'workflow_dispatch' || github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/workflows/js/check-build-changes.js

      - name: Setup Bun
        if: steps.check_changes.outputs.has_build_changes == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        if: steps.check_changes.outputs.has_build_changes == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install Dependencies
        if: steps.check_changes.outputs.has_build_changes == 'true'
        shell: bash
        run: |
          bun install --frozen-lockfile --linker=hoisted --concurrent-scripts 1 && cp -r ./node_modules/electron ./application/node_modules/electron && mkdir -p ./updater/node_modules && cp -r ./node_modules/electron ./updater/node_modules/electron

      - name: Download nightly plan
        if: inputs.nightly
        uses: actions/download-artifact@v4
        with:
          name: nightly-plan
          path: .nightly

      - name: Stamp nightly versions after frozen install
        if: inputs.nightly
        run: bun .github/workflows/js/nightly.ts stamp

      - name: Build Release Client
        if: steps.check_changes.outputs.has_build_changes == 'true'
        run: cd application && bun run electron-pack

      - name: Build Release Updater
        if: steps.check_changes.outputs.has_build_changes == 'true' && (!inputs.nightly || inputs.build_updater)
        run: cd updater && bun run electron-pack

      - name: Zip for Windows Portable
        if: matrix.os == 'windows-latest' && steps.check_changes.outputs.has_build_changes == 'true'
        run: |
          Compress-Archive -Path application/dist/win-unpacked/* -Destination application/dist/OpenGameInstaller-Portable.zip

      - name: Generate Windows blockmaps
        if: matrix.os == 'windows-latest' && steps.check_changes.outputs.has_build_changes == 'true'
        shell: bash
        env:
          BUILD_UPDATER: ${{ !inputs.nightly || inputs.build_updater }}
        run: |
          bun run .github/workflows/js/generate-blockmaps.mjs application/dist/OpenGameInstaller-Portable.zip
          if [ "$BUILD_UPDATER" = "true" ]; then
            bun run .github/workflows/js/generate-blockmaps.mjs updater/dist/OpenGameInstaller-Setup.exe
          fi

      - name: Generate Linux blockmaps
        if: matrix.os == 'ubuntu-latest' && steps.check_changes.outputs.has_build_changes == 'true'
        shell: bash
        env:
          BUILD_UPDATER: ${{ !inputs.nightly || inputs.build_updater }}
        run: |
          bun run .github/workflows/js/generate-blockmaps.mjs application/dist/OpenGameInstaller-linux-pt.AppImage
          if [ "$BUILD_UPDATER" = "true" ]; then
            bun run .github/workflows/js/generate-blockmaps.mjs updater/dist/OpenGameInstaller-Setup.AppImage
          fi

      - name: What's in the folders? (Windows)
        if: steps.check_changes.outputs.has_build_changes == 'true'
        shell: bash
        run: |
          ls -la application/dist/
          if [ -d updater/dist ]; then ls -la updater/dist/; fi

      - name: Upload Windows Assets as Artifacts
        if: matrix.os == 'windows-latest' && steps.check_changes.outputs.has_build_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            application/dist/OpenGameInstaller-Portable.zip
            application/dist/OpenGameInstaller-Portable.zip.blockmap
            updater/dist/OpenGameInstaller-Setup.exe
            updater/dist/OpenGameInstaller-Setup.exe.blockmap

      - name: Upload Linux Assets as Artifacts
        if: matrix.os == 'ubuntu-latest' && steps.check_changes.outputs.has_build_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            updater/dist/OpenGameInstaller-Setup.AppImage
            updater/dist/OpenGameInstaller-Setup.AppImage.blockmap
            application/dist/OpenGameInstaller-linux-pt.AppImage
            application/dist/OpenGameInstaller-linux-pt.AppImage.blockmap
