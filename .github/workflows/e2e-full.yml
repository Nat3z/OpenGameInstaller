name: Full deterministic E2E

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Deterministic suite to run
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    if: github.event_name == 'schedule' || inputs.suite == 'nightly'
    name: Nightly deterministic E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OGI_E2E_DETERMINISTIC_ONLY: '1'
      OGI_E2E_RUN_ROOT: ${{ github.workspace }}/.e2e-ci-runs
      OGI_E2E_ARTIFACT_NAME: nightly-e2e-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic failure and quarantined scenario matrix
        working-directory: e2e
        run: bun run ci:nightly
      - name: Upload retained E2E reports
        id: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-${{ matrix.os }}
          path: ${{ github.workspace }}/.e2e-ci-runs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Link retained E2E reports
        if: always()
        working-directory: e2e
        env:
          OGI_E2E_ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: bun run ci:publish-summary

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'release'
    name: Release deterministic E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OGI_E2E_DETERMINISTIC_ONLY: '1'
      OGI_E2E_RUN_ROOT: ${{ github.workspace }}/.e2e-ci-runs
      OGI_E2E_ARTIFACT_NAME: release-e2e-${{ matrix.os }}
      OGI_RELEASE_ARTIFACT_DIRECTORY: ${{ github.workspace }}/.release-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Linux traffic isolation tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace
      - name: Build publication artifacts
        shell: bash
        run: |
          bun run --cwd application electron-pack
          bun run --cwd updater electron-pack
      - name: Create Windows portable publication artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path application/dist/win-unpacked/* -DestinationPath application/dist/OpenGameInstaller-Portable.zip
      - name: Generate publication blockmaps (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bun run .github/workflows/js/generate-blockmaps.mjs application/dist/OpenGameInstaller-Portable.zip updater/dist/OpenGameInstaller-Setup.exe
      - name: Generate publication blockmaps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bun run .github/workflows/js/generate-blockmaps.mjs updater/dist/OpenGameInstaller-Setup.AppImage application/dist/OpenGameInstaller-linux-pt.AppImage
      - name: Collect publication artifacts
        shell: bash
        run: |
          mkdir -p "$OGI_RELEASE_ARTIFACT_DIRECTORY"
          find application/dist updater/dist -type f \( -name 'OpenGameInstaller-Portable.zip' -o -name 'OpenGameInstaller-Setup.exe' -o -name 'OpenGameInstaller-Setup.AppImage' -o -name 'OpenGameInstaller-linux-pt.AppImage' -o -name '*.blockmap' \) -exec cp {} "$OGI_RELEASE_ARTIFACT_DIRECTORY/" \;
      - name: Run production packaging smoke and full deterministic suite
        working-directory: e2e
        run: bun run ci:release
      - name: Upload retained E2E reports
        id: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-${{ matrix.os }}
          path: ${{ github.workspace }}/.e2e-ci-runs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Link retained E2E reports
        if: always()
        working-directory: e2e
        env:
          OGI_E2E_ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: bun run ci:publish-summary
