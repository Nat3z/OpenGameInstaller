name: Required E2E

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  required-e2e:
    name: Required E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OGI_E2E_DETERMINISTIC_ONLY: '1'
      OGI_E2E_RUN_ROOT: ${{ github.workspace }}/.e2e-ci-runs
      OGI_E2E_ARTIFACT_NAME: required-e2e-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run required deterministic E2E gates
        working-directory: e2e
        run: bun run ci:pull-request

      - name: Upload retained E2E reports
        id: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-e2e-${{ matrix.os }}
          path: ${{ github.workspace }}/.e2e-ci-runs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Link retained E2E reports
        if: always()
        working-directory: e2e
        env:
          OGI_E2E_ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: bun run ci:publish-summary
