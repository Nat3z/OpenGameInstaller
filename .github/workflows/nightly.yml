name: Nightly

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'packages/update-channel/**'
      - 'application/src/electron/updater.ts'
      - 'updater/**'
      - 'bun.lock'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
      force:
        description: Build even without changes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'schedule' || vars.NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      updater: ${{ steps.plan.outputs.updater }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_FORCE: ${{ github.event_name == 'pull_request' || inputs.force }}
          NIGHTLY_PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: bun .github/workflows/js/nightly.ts plan
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-plan
          path: .nightly/plan.json
          if-no-files-found: error
          include-hidden-files: true

  desktop:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      source: ${{ needs.prepare.outputs.source }}
      nightly: true
      build_updater: ${{ needs.prepare.outputs.updater == 'true' }}

  validate:
    needs: [prepare, desktop]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: nightly-plan
          path: .nightly
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-assets'
          path: .nightly/assets
          merge-multiple: true
      - run: bun .github/workflows/js/nightly.ts stamp
      - run: bun run build
      - name: Validate nightly artifacts and SDK tarballs
        env:
          NIGHTLY_PUBLISH: 'false'
        run: bun .github/workflows/js/nightly.ts publish
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-validated
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .nightly/plan.json
            .nightly/nightly.json
            .nightly/tarballs.json
            .nightly/tarballs/*
            .nightly/assets/*

  publish:
    needs: [prepare, validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: nightly-validated
          path: .nightly
      - run: bun .github/workflows/js/nightly.ts stamp
      - name: Publish validated nightly
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NIGHTLY_PUBLISH: 'true'
        run: bun .github/workflows/js/nightly.ts publish
