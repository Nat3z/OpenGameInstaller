<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenGameInstaller Updater</title>
  </head>
  <body>
    <div>
      <main>
        <img
          src="./favicon-256x256.png"
          alt="OpenGameInstaller"
          width="128"
          height="128"
        />

        <div id="status-presentation">
          <h1 id="updater-heading" tabindex="-1">Checking for Updates</h1>
          <p id="status-detail" style="display: none"></p>
        </div>
        <progress
          aria-label="Update progress"
          aria-describedby="status-detail"
          value="10"
          max="100"
          style="display: none"
        ></progress>
        <div
          role="status"
          aria-live="polite"
          aria-atomic="true"
          class="visually-hidden"
        ></div>
        <div
          role="alert"
          aria-live="assertive"
          aria-atomic="true"
          style="display: none"
        >
          <h1 id="updater-alert-heading" tabindex="-1">Updater alert</h1>
          <p id="alert-detail" style="display: none"></p>
        </div>
        <section
          id="channel-picker"
          aria-labelledby="updater-heading"
          style="display: none"
        >
          <fieldset id="channel-screen" aria-label="Update channel">
            <div class="chips">
              <button type="button" data-channel="stable">Stable</button>
              <button type="button" data-channel="unstable">Unstable</button>
              <button type="button" data-channel="bleeding-edge">
                Bleeding Edge
              </button>
            </div>
          </fieldset>
          <div id="bleeding-edge-screen" style="display: none">
            <button type="button" id="bleeding-edge-back" class="back-button">
              Back
            </button>
            <label for="branch-select" id="branch-label" class="field-label"
              >Branch</label
            >
            <select id="branch-select" aria-label="Branch">
              <option value="main">main</option>
            </select>
            <label for="commit-input" class="field-label"
              >Optional commit SHA, branch, or tag</label
            >
            <input
              id="commit-input"
              type="text"
              placeholder="Optional commit SHA, branch, or tag"
              autocomplete="off"
            />
            <section
              id="commit-list"
              aria-label="Recent commits"
              aria-live="polite"
              style="display: none"
            ></section>
            <button type="button" id="bleeding-edge-build" class="build-button">
              Build Selected
            </button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
<script>
  const ANNOUNCEMENT_INTERVAL_MS = 5000;
  let lastAnnouncementAt = 0;
  let lastAnnouncementTitle = '';
  let lastProgressBucket = -1;
  let pendingAnnouncement;
  let pendingAnnouncementTimer;

  function progressBucket(payload) {
    if (payload.kind !== 'progress') return -1;
    const percentage =
      (payload.progress.value / Math.max(payload.progress.max, 1)) * 100;
    return Math.floor(Math.max(0, Math.min(percentage, 100)) / 10);
  }

  function publishStatusAnnouncement(payload) {
    const announcement = document.querySelector('[role="status"]');
    announcement.textContent = payload.detail
      ? `${payload.title}. ${payload.detail}`
      : payload.title;
    lastAnnouncementAt = Date.now();
    lastAnnouncementTitle = payload.title;
    lastProgressBucket = progressBucket(payload);
    pendingAnnouncement = undefined;
    pendingAnnouncementTimer = undefined;
  }

  function queueStatusAnnouncement(payload) {
    const now = Date.now();
    const bucket = progressBucket(payload);
    const shouldPublishNow =
      payload.kind === 'recovery' ||
      payload.title !== lastAnnouncementTitle ||
      (bucket >= 0 && bucket !== lastProgressBucket) ||
      now - lastAnnouncementAt >= ANNOUNCEMENT_INTERVAL_MS;
    if (shouldPublishNow) {
      if (pendingAnnouncementTimer) clearTimeout(pendingAnnouncementTimer);
      publishStatusAnnouncement(payload);
      return;
    }

    pendingAnnouncement = payload;
    if (!pendingAnnouncementTimer) {
      pendingAnnouncementTimer = setTimeout(() => {
        if (pendingAnnouncement) publishStatusAnnouncement(pendingAnnouncement);
      }, ANNOUNCEMENT_INTERVAL_MS - (now - lastAnnouncementAt));
    }
  }

  function cancelPendingStatusAnnouncement() {
    if (pendingAnnouncementTimer) clearTimeout(pendingAnnouncementTimer);
    pendingAnnouncement = undefined;
    pendingAnnouncementTimer = undefined;
  }

  window.ogiUpdater.onStatus((payload) => {
    const picker = document.querySelector('#channel-picker');
    const statusPresentation = document.querySelector('#status-presentation');
    const statusAnnouncement = document.querySelector('[role="status"]');
    const alertRegion = document.querySelector('[role="alert"]');
    const statusHeading = document.querySelector('#updater-heading');
    const alertHeading = document.querySelector('#updater-alert-heading');
    const progress = document.querySelector('progress');
    const statusDetail = document.querySelector('#status-detail');
    const alertDetail = document.querySelector('#alert-detail');
    const isFailure = payload.severity === 'assertive';
    const alertHadFocus = alertRegion.contains(document.activeElement);

    picker.style.display = 'none';
    statusPresentation.style.display = isFailure ? 'none' : 'block';
    alertRegion.style.display = isFailure ? 'block' : 'none';
    progress.style.display = 'none';
    progress.removeAttribute('aria-valuetext');
    statusDetail.style.display = 'none';
    alertDetail.style.display = 'none';
    statusDetail.textContent = '';
    alertDetail.textContent = '';

    if (isFailure) {
      cancelPendingStatusAnnouncement();
      statusAnnouncement.textContent = '';
      alertHeading.textContent = payload.title;
      if (payload.detail) {
        alertDetail.textContent = payload.detail;
        alertDetail.style.display = 'block';
      }
      alertHeading.focus();
      return;
    }

    statusHeading.textContent = payload.title;
    if (payload.kind === 'progress') {
      progress.value = payload.progress.value;
      progress.max = payload.progress.max;
      if (payload.detail) {
        progress.setAttribute('aria-valuetext', payload.detail);
      }
      progress.style.display = 'block';
    }
    if (payload.detail) {
      statusDetail.textContent = payload.detail;
      statusDetail.style.display = 'block';
    }
    queueStatusAnnouncement(payload);
    if (alertHadFocus) statusHeading.focus();
  });

  function showChannelScreen(screen) {
    const isBleedingEdge = screen === 'bleeding-edge';
    document.querySelector('#channel-screen').style.display = isBleedingEdge
      ? 'none'
      : 'block';
    document.querySelector('#bleeding-edge-screen').style.display = isBleedingEdge
      ? 'block'
      : 'none';
    document.querySelector('#updater-heading').textContent = isBleedingEdge
      ? 'Bleeding Edge Build'
      : 'Choose Update Channel';
    document.querySelector('#status-detail').textContent = isBleedingEdge
      ? 'Pick a branch and optional commit, then build from source.'
      : 'Stable uses normal releases. Unstable uses pre-releases. Bleeding Edge builds from source.';
    document.querySelector('#status-presentation').style.display = 'block';
    document.querySelector('[role="alert"]').style.display = 'none';
    cancelPendingStatusAnnouncement();
    document.querySelector('[role="status"]').textContent = '';
    queueMicrotask(() => {
      const focusTarget = isBleedingEdge
        ? document.querySelector('#bleeding-edge-back')
        : document.querySelector('[data-channel="stable"]');
      if (document.querySelector('#channel-picker').style.display !== 'none') {
        focusTarget.focus();
      }
    });
  }

  function resetBleedingEdgePicker() {
    document.querySelector('#commit-input').value = '';
    document.querySelector('#commit-list').style.display = 'none';
    document.querySelector('#commit-list').innerHTML = '';
    const select = document.querySelector('#branch-select');
    select.innerHTML = '<option value="main">main</option>';
    select.value = 'main';
    select.disabled = false;
    showChannelScreen('channels');
  }

  window.ogiUpdater.onShowChannelPicker(() => {
    document.querySelector('progress').style.display = 'none';
    document.querySelector('#status-detail').style.display = 'block';
    resetBleedingEdgePicker();
    document.querySelector('#channel-picker').style.display = 'block';
  });

  function getSelectedBranch() {
    return document.querySelector('#branch-select').value || 'main';
  }

  async function loadBranches() {
    const select = document.querySelector('#branch-select');
    select.disabled = true;
    select.setAttribute('aria-busy', 'true');
    select.innerHTML = '<option value="">Loading branches...</option>';
    try {
      const result = await window.ogiUpdater.getBranches();
      const branches =
        result.ok && result.branches.length ? result.branches : ['main'];
      select.innerHTML = '';
      branches.forEach((branch) => {
        const option = document.createElement('option');
        option.value = branch;
        option.textContent = branch;
        select.appendChild(option);
      });
      if (!select.value) {
        select.value = branches.includes('main') ? 'main' : branches[0];
      }
    } catch (error) {
      select.innerHTML = '<option value="main">main</option>';
      select.value = 'main';
    } finally {
      select.disabled = false;
      select.removeAttribute('aria-busy');
    }
  }

  function normalizeCommit(value) {
    return value.trim().toLowerCase();
  }

  function syncCommitSelection() {
    const selectedCommit = normalizeCommit(
      document.querySelector('#commit-input').value
    );
    document.querySelectorAll('.commit-item').forEach((item) => {
      const isSelected =
        selectedCommit.length > 0 &&
        normalizeCommit(item.dataset.commitSha || '') === selectedCommit;
      item.classList.toggle('selected', isSelected);
      item.setAttribute('aria-pressed', String(isSelected));
    });
  }

  async function loadCommitList() {
    const list = document.querySelector('#commit-list');
    const branch = getSelectedBranch();
    list.style.display = 'block';
    list.setAttribute('aria-busy', 'true');
    list.textContent = `Loading commits for ${branch}...`;
    try {
      const result = await window.ogiUpdater.getRecentCommits(branch);
      if (!result.ok || !result.commits.length) {
        list.textContent = result.error || 'No commits found.';
        return;
      }
      list.innerHTML = '';
      result.commits.forEach((commit) => {
        const item = document.createElement('button');
        item.className = 'commit-item';
        item.type = 'button';
        item.dataset.commitSha = commit.sha;
        item.setAttribute('aria-pressed', 'false');
        item.setAttribute(
          'aria-label',
          `Commit ${commit.shortSha}: ${commit.message}`
        );
        item.innerHTML = `
          <strong>${commit.shortSha}</strong>
          <span>${commit.message}</span>
          <small>${commit.author} • ${new Date(commit.date).toLocaleDateString()}</small>
        `;
        item.addEventListener('click', () => {
          document.querySelector('#commit-input').value = commit.sha;
          syncCommitSelection();
        });
        list.appendChild(item);
      });
      syncCommitSelection();
    } catch (error) {
      list.textContent = 'Failed to load commits.';
    } finally {
      list.removeAttribute('aria-busy');
    }
  }

  document
    .querySelector('#commit-input')
    .addEventListener('input', syncCommitSelection);

  document.querySelector('#branch-select').addEventListener('change', () => {
    if (document.querySelector('#commit-list').style.display !== 'none') {
      loadCommitList();
    }
  });

  function applyChannel(channel) {
    window.ogiUpdater.chooseChannel(
      channel,
      document.querySelector('#commit-input').value,
      getSelectedBranch()
    );
    document.querySelector('#channel-picker').style.display = 'none';
    document.querySelector('#updater-heading').textContent = 'Applying Channel';
    document.querySelector('#status-detail').textContent =
      `Selected ${channel} update channel.`;
    document.querySelector('#updater-heading').focus();
  }

  document.querySelectorAll('[data-channel]').forEach((button) => {
    button.addEventListener('click', async () => {
      if (button.dataset.channel === 'bleeding-edge') {
        showChannelScreen('bleeding-edge');
        await loadBranches();
        await loadCommitList();
        return;
      }
      applyChannel(button.dataset.channel);
    });
  });

  document
    .querySelector('#bleeding-edge-back')
    .addEventListener('click', () => {
      resetBleedingEdgePicker();
    });

  document
    .querySelector('#bleeding-edge-build')
    .addEventListener('click', () => {
      applyChannel('bleeding-edge');
    });
</script>
<style>
  body {
    background-color: #f0f0f0;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  main {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100vh;
  }
  #status-presentation,
  [role='alert'] {
    width: 100%;
    text-align: center;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }
  main h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 300;
    font-size: 1.25rem;
    color: rgb(75, 75, 75);
    outline: none;
  }
  main p {
    font-family: 'Archivo', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    color: rgb(75, 75, 75);
    text-align: center;
    padding: 0 1rem;
  }
  #channel-picker {
    width: 90%;
  }
  #channel-screen {
    min-width: 0;
    margin: 0;
    border: 0;
    padding: 0;
  }
  #bleeding-edge-screen {
    max-height: 14rem;
    overflow-y: auto;
  }
  .back-button,
  .build-button {
    box-sizing: border-box;
    width: 100%;
    border: 0;
    border-radius: 999px;
    font-family: 'Archivo', sans-serif;
    padding: 0.55rem 0.25rem;
    cursor: pointer;
  }
  .back-button {
    margin-bottom: 0.5rem;
    background: rgb(200, 200, 200);
    color: rgb(60, 60, 60);
  }
  .build-button {
    margin-top: 0.75rem;
    background: rgb(43, 104, 111);
    color: white;
  }
  .chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    width: 100%;
  }
  .chips button {
    border: 0;
    border-radius: 999px;
    background: rgb(43, 104, 111);
    color: white;
    font-family: 'Archivo', sans-serif;
    padding: 0.65rem 0.25rem;
    cursor: pointer;
  }
  .field-label {
    display: block;
    margin-top: 0.75rem;
    margin-bottom: 0.25rem;
    font-family: 'Archivo', sans-serif;
    font-size: 0.85rem;
    color: rgb(90, 90, 90);
  }
  #branch-select,
  #commit-input {
    box-sizing: border-box;
    width: 100%;
    border: 1px solid rgb(174, 205, 199);
    border-radius: 0.5rem;
    padding: 0.55rem;
    font-family: 'Archivo', sans-serif;
    background: white;
    color: rgb(80, 80, 80);
  }
  button:focus-visible,
  select:focus-visible,
  input:focus-visible {
    outline: 3px solid rgb(22, 91, 99);
    outline-offset: 2px;
  }
  #commit-list {
    margin-top: 0.75rem;
    max-height: 9rem;
    overflow: auto;
  }
  .commit-item {
    display: grid;
    gap: 0.15rem;
    width: 100%;
    margin-bottom: 0.4rem;
    border: 1px solid rgb(174, 205, 199);
    border-radius: 0.5rem;
    background: white;
    color: rgb(80, 80, 80);
    padding: 0.45rem;
    text-align: left;
    cursor: pointer;
  }
  .commit-item.selected {
    border-color: rgb(43, 104, 111);
    background: rgb(230, 246, 243);
  }
  .commit-item span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .commit-item small {
    color: rgb(90, 90, 90);
  }

  * {
    -webkit-touch-callout: none; /* iOS Safari */
    -webkit-user-select: none; /* Safari */
    -moz-user-select: none; /* Old versions of Firefox */
    -ms-user-select: none; /* Internet Explorer/Edge */
    user-select: none; /* Non-prefixed version, currently
																		supported by Chrome, Edge, Opera and Firefox */
  }
  @font-face {
    font-family: 'Archivo';
    src: url(./Archivo-VariableFont_wdth\,wght.ttf);
  }

  progress {
    height: 0.3rem;
    width: 80%;
    appearance: none;
  }

  progress::-webkit-progress-bar {
    border-radius: 0.5rem;
    background-color: rgb(174, 205, 199);
  }

  progress::-webkit-progress-value {
    border-radius: 0.5rem;
    background-color: rgb(43, 104, 111);
  }
</style>
